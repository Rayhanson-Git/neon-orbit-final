# One-off diagnostic: report the GitHub Pages settings as an annotation. Deleted right after.
name: Report Pages settings
on:
  push:
    paths: ['.github/workflows/fix-pages-source.yml']
permissions:
  contents: read
  pages: read
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: echo "::notice title=pages::$(gh api repos/${{ github.repository }}/pages --jq '{cname, source, build_type, html_url, status, https_enforced}' | tr -d '\n')"
