# One-off: check what the live sites serve. Deleted right after.
name: Live site check
on:
  push:
    paths: ['.github/workflows/live-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120
          for url in https://gesture-particles.rayhanson.tech/assets/index-B0_gx8Og.js https://virtual-theremin.rayhanson.tech/assets/index-DvkE8z8F.js https://rayhanson.tech/projects/wasp-dodge/index.html; do
            res=$(curl -sL -o /dev/null -w '%{http_code} %{content_type}' --max-time 30 "$url")
            echo "::notice title=$url::$res"
          done
